name: 活動データの自動更新

on:
  schedule:
    - cron: "0 */6 * * *"   # 6時間ごと（UTC）
  workflow_dispatch:        # 手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: note と Substack を読んで data.json を作る
        run: python scripts/update_data.py
      - name: 内容が変わった時だけ保存する
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "data-updater"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "data.json を自動更新"
            git push
          else
            echo "変更なし"
          fi
